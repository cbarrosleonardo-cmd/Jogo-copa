<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leilão Copas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#1C6A45">
<title>Leilão das Copas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#EDF2EE; --paper:#FFFFFF; --ink:#14231A; --muted:#566A5E; --line:#CFDAD2;
  --grass:#1C6A45; --grass-2:#155236; --chalk:#F3F7F4; --gold:#C99A1C; --gold-soft:#F6E7B8; --red:#B7412C; --win:#1C6A45;
  --r:12px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0E1A13; --paper:#16261D; --ink:#E7EFE9; --muted:#9DB2A5; --line:#29402F; --grass:#23835A; --grass-2:#1A6546; --gold:#E0B43A; --gold-soft:#3A3217; --red:#E0735E; --win:#4CC28B; } }
:root[data-theme="dark"]{ --bg:#0E1A13; --paper:#16261D; --ink:#E7EFE9; --muted:#9DB2A5; --line:#29402F; --grass:#23835A; --grass-2:#1A6546; --gold:#E0B43A; --gold-soft:#3A3217; --red:#E0735E; --win:#4CC28B; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.45; -webkit-text-size-adjust:100%; }
h1,h2,h3,.btn,.card-ov,.price strong,.score strong,.seg button,output,.meter strong{ font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif; }
h2{ font-size:22px; font-weight:700; margin:28px 0 10px; letter-spacing:.2px; }
h3{ margin:0; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }
.wrap{ max-width:560px; margin:0 auto; padding:16px 16px 48px; }

/* capa */
.hero{ background:var(--grass); color:#fff; position:relative; overflow:hidden; }
.hero::before{ content:""; position:absolute; left:50%; bottom:-160px; width:260px; height:260px; margin-left:-130px; border:2px solid rgba(255,255,255,.28); border-radius:50%; }
.hero::after{ content:""; position:absolute; left:0; right:0; bottom:-30px; border-top:2px solid rgba(255,255,255,.28); }
.hero-in{ max-width:560px; margin:0 auto; padding:40px 16px 64px; position:relative; }
.hero h1{ font-size:clamp(46px,13vw,76px); line-height:.9; font-weight:800; font-style:italic; margin:0 0 12px; letter-spacing:-1px; }
.hero p{ margin:0; max-width:34ch; font-size:17px; color:rgba(255,255,255,.88); }

.resume{ display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--paper); border:1px solid var(--line); border-left:5px solid var(--gold); border-radius:var(--r); padding:12px 14px; margin-top:4px; }
.resume div{ display:flex; flex-direction:column; } .resume span{ color:var(--muted); font-size:14px; }

.modes{ display:grid; gap:8px; }
.mode{ text-align:left; background:var(--paper); border:2px solid var(--line); border-radius:var(--r); padding:12px 14px; display:flex; flex-direction:column; gap:2px; }
.mode strong{ font-family:"Barlow Condensed",sans-serif; font-size:20px; }
.mode span{ color:var(--muted); font-size:14px; }
.mode.on{ border-color:var(--grass); box-shadow:inset 0 0 0 1px var(--grass); }

.seg{ display:flex; gap:6px; }
.seg.wrapseg{ flex-wrap:wrap; }
.seg button{ flex:1 1 0; white-space:nowrap; min-height:44px; background:var(--paper); border:2px solid var(--line); border-radius:10px; font-size:17px; font-weight:600; padding:0 2px; }
.seg.wrapseg button{ flex:1 0 28%; }
.seg button.on{ background:var(--grass); border-color:var(--grass); color:#fff; }
.hint{ color:var(--muted); font-size:14px; margin:8px 0 0; }
.stepper{ display:flex; align-items:center; gap:14px; }
.stepper button{ width:48px; height:48px; border-radius:50%; border:2px solid var(--line); background:var(--paper); font-size:24px; }
.stepper output{ font-size:36px; font-weight:800; min-width:2ch; text-align:center; }
.names{ display:grid; gap:8px; }
.namerow{ display:flex; gap:8px; }
.namerow input, .namerow select, .stylepick select{ min-height:44px; border:2px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); padding:0 10px; font:inherit; }
.namerow input{ flex:1; min-width:0; }
.x{ width:44px; border:0; background:none; font-size:24px; color:var(--muted); }

.btn{ display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 16px; border-radius:10px; border:2px solid var(--grass); background:var(--grass); color:#fff; font-size:19px; font-weight:700; letter-spacing:.3px; }
.btn:active{ transform:translateY(1px); }
.btn:disabled{ opacity:.35; cursor:not-allowed; }
.btn.ghost{ background:transparent; color:var(--grass); }
.btn.big{ width:100%; margin-top:16px; min-height:54px; font-size:21px; }
.link{ background:none; border:0; color:var(--grass); font-weight:600; padding:8px 0; text-decoration:underline; text-underline-offset:3px; }
.link.light{ color:#fff; }

.bar-top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--grass-2); color:#fff; display:flex; justify-content:space-between; align-items:center; padding:8px 16px; font-size:15px; }
.bar-top strong{ font-size:18px; }
.quit{ background:var(--paper); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.quit span{ flex:1 0 100%; font-weight:600; }

/* figurinha */
.card{ position:relative; background:var(--paper); border:3px solid var(--ink); border-radius:16px; padding:14px 16px 12px; margin:10px 4px 16px; transform:rotate(-1.2deg); }
.card.gold{ border-color:var(--gold); background:linear-gradient(135deg,var(--paper) 0%,var(--paper) 55%,var(--gold-soft) 100%); box-shadow:0 0 0 3px var(--gold-soft); }
.card-top{ display:flex; gap:8px; align-items:center; font-size:14px; }
.copa{ background:var(--grass); color:#fff; font-weight:700; border-radius:6px; padding:1px 8px; }
.sel{ color:var(--muted); font-weight:600; }
.card-ov{ position:absolute; top:6px; right:14px; font-size:58px; font-weight:800; line-height:1; }
.card.gold .card-ov{ color:var(--gold); }
.card h3{ font-family:"Barlow Condensed",sans-serif; font-size:32px; font-weight:800; line-height:1.05; margin:14px 70px 2px 0; }
.card-pos{ color:var(--muted); font-weight:600; display:flex; gap:8px; align-items:center; }
.crq{ background:var(--gold); color:#1d1604; font-size:13px; font-weight:700; border-radius:20px; padding:1px 9px; }
.bars{ display:grid; gap:6px; margin:12px 0 4px; }
.bar{ display:grid; grid-template-columns:64px 1fr 30px; align-items:center; gap:8px; font-size:14px; }
.bar i{ height:8px; border-radius:4px; background:var(--line); position:relative; overflow:hidden; }
.bar i::after{ content:""; position:absolute; inset:0; width:var(--v); background:var(--grass); border-radius:4px; }
.bar b{ text-align:right; }
.tecnote{ color:var(--muted); font-size:14px; margin:10px 0 4px; }
.card-price{ border-top:1px dashed var(--line); margin-top:10px; padding-top:8px; font-size:14px; color:var(--muted); display:flex; justify-content:space-between; }
.card-price strong{ color:var(--ink); font-size:16px; }

.panel{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin-top:12px; }
.panel h2{ margin-top:0; }
.price{ display:grid; text-align:center; gap:2px; }
.price span{ color:var(--muted); font-size:14px; }
.price strong{ font-size:54px; font-weight:800; line-height:1; }
.price em{ font-style:normal; font-weight:600; }
.bids{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:14px; }
.bids.two{ grid-template-columns:1fr 1fr; }
.log{ list-style:none; padding:0; margin:12px 0 0; border-top:1px solid var(--line); }
.log li{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; }
.result{ text-align:center; display:grid; gap:6px; }
.result strong{ font-family:"Barlow Condensed",sans-serif; font-size:28px; line-height:1.1; }
.result span{ color:var(--muted); }
.result.win{ border-color:var(--win); box-shadow:inset 0 0 0 1px var(--win); }
.result.win strong{ color:var(--win); }
.handoff{ text-align:center; display:grid; gap:6px; padding:36px 16px; }
.handoff span{ color:var(--muted); }
.handoff strong{ font-family:"Barlow Condensed",sans-serif; font-size:44px; font-weight:800; }
input[type=range]{ width:100%; margin-top:14px; accent-color:var(--grass); height:32px; }

.rosters{ margin-top:22px; }
.rp-top{ display:flex; justify-content:space-between; align-items:baseline; }
.rp-top h2{ margin:0 0 8px; }
.rp{ border-top:1px solid var(--line); padding:10px 0; }
.rp.human .rp-h strong{ color:var(--grass); }
.rp-h{ display:flex; justify-content:space-between; font-weight:600; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
.chip{ border:1px solid var(--line); border-radius:6px; padding:1px 7px; font-size:13px; font-weight:600; }
.chip.ok{ border-color:var(--win); color:var(--win); }
.mini{ list-style:none; padding:0; margin:8px 0 0; font-size:14px; }
.mini li{ display:flex; gap:8px; padding:3px 0; }
.mini li span{ width:34px; color:var(--muted); font-weight:600; }
.mini li em{ color:var(--muted); font-style:normal; }
.mini li b{ margin-left:auto; }

.squad{ margin-top:8px; }
.sq-h{ display:flex; justify-content:space-between; align-items:baseline; }
.sq-h span{ font-family:"Barlow Condensed",sans-serif; font-size:22px; font-weight:700; color:var(--muted); }
.meters{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.meter{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px; display:grid; gap:2px; }
.meter span{ font-size:13px; color:var(--muted); }
.meter strong{ font-size:30px; font-weight:800; line-height:1; }
.meter.main{ background:var(--grass); border-color:var(--grass); color:#fff; } .meter.main span{ color:rgba(255,255,255,.85); }
.meter i{ height:4px; background:var(--line); border-radius:2px; position:relative; }
.meter i::after{ content:""; position:absolute; inset:0; width:var(--v); background:currentColor; border-radius:2px; opacity:.7; }
.lineup{ list-style:none; padding:0; margin:12px 0; background:var(--paper); border:1px solid var(--line); border-radius:var(--r); }
.lineup li{ display:flex; align-items:center; gap:10px; padding:8px 12px; border-bottom:1px solid var(--line); }
.lineup li:last-child{ border-bottom:0; }
.lineup .pos{ width:36px; font-weight:700; color:var(--muted); font-size:14px; }
.lineup .nm{ display:flex; flex-direction:column; line-height:1.2; }
.lineup .nm em{ font-style:normal; color:var(--muted); font-size:13px; }
.lineup b{ margin-left:auto; font-family:"Barlow Condensed",sans-serif; font-size:22px; }
.lineup .crqrow b{ color:var(--gold); }
.stylepick{ display:grid; gap:4px; font-weight:600; margin-top:12px; }
.note{ background:var(--gold-soft); border-radius:10px; padding:10px 12px; font-size:14px; }
.legend{ font-size:14px; color:var(--muted); margin-top:14px; } .legend strong{ color:var(--ink); display:block; }
.odds{ display:grid; grid-template-columns:1.4fr repeat(4,1fr); gap:6px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); }
.odds div{ display:grid; text-align:center; } .odds span{ font-size:12px; color:var(--muted); } .odds b{ font-family:"Barlow Condensed",sans-serif; font-size:22px; }

.vs{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; text-align:center; }
.vs div{ display:grid; } .vs strong{ font-family:"Barlow Condensed",sans-serif; font-size:22px; line-height:1.1; }
.vs strong em, .orow em, .score em, td em{ font-style:normal; color:var(--muted); font-weight:500; font-size:.85em; }
.vs span{ color:var(--muted); font-size:14px; } .vs i{ font-style:normal; color:var(--muted); }
.score{ display:grid; grid-template-columns:1fr auto 1fr; gap:10px; align-items:center; text-align:center; font-weight:600; }
.score strong{ font-size:44px; font-weight:800; white-space:nowrap; }
.mcard.big{ border-color:var(--grass); }
.goals{ display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:13px; color:var(--muted); text-align:center; }
.goals p{ margin:6px 0 0; }
.pens{ text-align:center; font-weight:700; margin:4px 0 0; }
.others{ margin-top:12px; background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; }
.others summary{ font-weight:600; cursor:pointer; }
.orow{ display:grid; grid-template-columns:1fr auto 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font-size:14px; align-items:center; }
.orow span:first-child{ text-align:right; } .orow b{ white-space:nowrap; text-align:center; }
.orow.me{ font-weight:700; color:var(--grass); }
h3.stage{ font-family:"Barlow Condensed",sans-serif; font-size:19px; margin:16px 0 4px; }
.group{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; margin-top:10px; overflow-x:auto; }
.group h3{ font-family:"Barlow Condensed",sans-serif; font-size:19px; }
table{ width:100%; border-collapse:collapse; font-size:14px; margin-top:6px; }
th{ text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:4px 0; }
th:not(:first-child), td:not(:first-child){ text-align:center; width:34px; }
td{ padding:5px 0; border-top:1px solid var(--line); }
tr.me td{ font-weight:700; color:var(--grass); }
tr.q td:first-child{ box-shadow:inset 3px 0 0 var(--grass); padding-left:6px; }
.trophy{ text-align:center; padding:28px 16px; background:var(--paper); border:3px solid var(--line); border-radius:18px; margin-top:8px; }
.trophy.won{ border-color:var(--gold); background:linear-gradient(160deg,var(--paper) 40%,var(--gold-soft)); }
.trophy span{ color:var(--muted); font-weight:600; }
.trophy h2{ font-size:44px; font-weight:800; font-style:italic; margin:4px 0; line-height:1; }
.trophy.won h2{ color:var(--gold); }
@media (prefers-reduced-motion:reduce){ *{ transition:none!important; } }

h2.first{ margin-top:4px; }
/* v2 */
.team7{ display:flex; gap:14px; align-items:center; background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:12px; margin-top:6px; }
.team7 p{ margin:0; font-size:15px; }
.pitch{ width:92px; flex:none; }
.pitch rect,.pitch line,.pitch circle{ fill:none; stroke:var(--grass); stroke-width:1.2; }
.pitch rect:first-child{ fill:color-mix(in srgb,var(--grass) 12%,transparent); }
.pitch .dot{ fill:var(--grass); stroke:none; }
.pitch text{ fill:#fff; font:700 5.6px "Barlow Condensed",sans-serif; text-anchor:middle; }
.ctl{ display:flex; gap:8px; justify-content:flex-end; }
.chipbtn{ min-height:36px; padding:0 12px; border-radius:18px; border:1.5px solid var(--line); background:var(--paper); font-weight:600; font-size:14px; }
.chipbtn.on{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.call{ font-family:"Barlow Condensed",sans-serif; font-size:20px!important; font-weight:700; color:var(--ink)!important; }
.call.c1{ color:var(--gold)!important; } .call.c2{ color:var(--red)!important; }
.log li.top{ font-weight:700; }
.watch{ text-align:center; color:var(--muted); font-weight:600; margin:14px 0 2px; }
.sold{ font-style:normal; font-family:"Barlow Condensed",sans-serif; font-weight:800; font-size:18px; color:var(--red); }
.mini li i{ font-style:normal; color:var(--muted); width:44px; text-align:right; }
.squad.rival{ background:var(--paper); border:1px solid var(--line); border-radius:var(--r); padding:10px 12px; margin-top:8px; }
.squad.rival summary{ display:flex; justify-content:space-between; cursor:pointer; font-size:18px; }
.squad.rival summary span{ font-family:"Barlow Condensed",sans-serif; font-weight:800; }
b.hum{ color:var(--grass); } b.riv{ color:var(--red); }
.drawball{ text-align:center; background:var(--grass); color:#fff; border-radius:var(--r); padding:18px 12px; min-height:92px; display:grid; align-content:center; gap:2px; }
.drawball span{ opacity:.85; font-weight:600; }
.drawball strong{ font-family:"Barlow Condensed",sans-serif; font-size:30px; line-height:1.1; }
.drawball em{ color:rgba(255,255,255,.75); } .drawball b.hum,.drawball b.riv{ color:var(--gold-soft); }
.dgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
.dg{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:8px 10px; }
.dg h3{ font-family:"Barlow Condensed",sans-serif; font-size:17px; }
.dslot{ font-size:13px; padding:3px 0; border-top:1px solid var(--line); min-height:24px; opacity:.25; }
.dslot.in{ opacity:1; } .dslot.new{ background:var(--gold-soft); }
.clock{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 40px); z-index:4; background:var(--ink); color:var(--paper); border-radius:var(--r); padding:10px 14px; display:flex; align-items:center; gap:12px; }
.clock strong{ font-family:"Barlow Condensed",sans-serif; font-size:40px; font-weight:800; line-height:1; min-width:2.6ch; }
.clock span{ font-weight:600; flex:1; }
.clock .chipbtn{ background:transparent; color:var(--paper); border-color:rgba(255,255,255,.35); }
.clock .chipbtn.on{ background:var(--paper); color:var(--ink); }
.panel.live.goal{ border-color:var(--gold); box-shadow:0 0 0 3px var(--gold-soft); }
.gooal{ text-align:center; font-family:"Barlow Condensed",sans-serif; font-size:26px; font-weight:800; font-style:italic; color:var(--gold); margin:6px 0 0; }
.feed{ list-style:none; padding:0; margin:10px 0 0; border-top:1px solid var(--line); }
.feed li{ display:flex; gap:8px; align-items:baseline; padding:6px 0; border-bottom:1px solid var(--line); font-size:15px; flex-wrap:wrap; }
.feed li b{ font-family:"Barlow Condensed",sans-serif; font-size:18px; width:2.6ch; }
.feed li em{ font-style:normal; color:var(--muted); font-size:13px; }
.feed li.none{ color:var(--muted); }
.pens-live{ margin-top:10px; } .pens-live strong{ font-family:"Barlow Condensed",sans-serif; font-size:22px; }
.pens-live ol{ margin:6px 0 0; padding-left:20px; font-size:14px; }
.pens-live li.g::marker{ color:var(--win); } .pens-live li.m{ color:var(--red); }
.pens-live li span{ color:var(--muted); margin-right:6px; }
.panel.list{ padding:4px 12px; }
.orow.flash{ background:var(--gold-soft); }
.orow small, .score small{ font-size:.7em; color:var(--muted); }
@media (prefers-reduced-motion:no-preference){ .dslot.new, .orow.flash, .panel.live.goal{ transition:background .3s, box-shadow .3s; } }
.feed li.sep{ justify-content:center; color:var(--muted); font-size:13px; font-weight:600; background:var(--bg); }
.clock span{ white-space:nowrap; } .clock .ctl{ flex:none; } .clock .chipbtn{ white-space:nowrap; padding:0 10px; }
</style>
</head>
<body>

function gauss(){ let u=0,v=0; while(!u)u=rnd(); while(!v)v=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

// ---- sorteio do lote: só posições que alguém ainda precisa ----
function drawLot(state, onlyFor){
  const sold = new Set(state.sold);
  const who = (onlyFor ? state.parts.filter(p=>p.name===onlyFor) : state.parts).filter(p=>slotsLeft(p)>0);
  if(!who.length) return null;
  const demand={}; who.forEach(p=>Object.entries(needs(p)).forEach(([k,v])=>demand[k]=(demand[k]||0)+v*(p.human?1.6:1)));
  if(demand.TEC) demand.TEC*=0.7;
  const c = weighted(Object.keys(demand), k=>demand[k]);
  const pool = (c==="TEC" ? state.db.coaches : state.db.players.filter(x=>cat(x.pos)===c)).filter(x=>!sold.has(x.id));
  if(!pool.length) return null;
  const aff = Math.max(...who.filter(p=>needs(p)[c]).map(maxBid));
  let cand = pool.filter(x=>x.preco <= aff*1.6);
  if(!cand.length) cand = pool.slice().sort((a,b)=>a.preco-b.preco).slice(0,10);
  return weighted(cand, x=>Math.exp((x.ov-76)/4));
}

// ---- leilão aberto com contagem regressiva ----
function botValue(bot, lot){
  if(!canBid(bot, lot)) return 0;
  const c=cat(lot.pos);
  let v = lot.preco * BOTS[bot.bot.idx].f(c) * (0.75 + rnd()*0.5);
  if(lot.craque) v *= 1.08;
  const perSlot = bot.budget/Math.max(slotsLeft(bot),1), plan = bot.startBudget/8;

function openLot(state, lot){

  const vals={};
  state.parts.filter(p=>!p.human).forEach(b=>{
    let v=botValue(b,lot);
    const rivals = needers.filter(p=>p!==b);
    if(canBid(b,lot) && !rivals.length) v=Math.max(v,start);  // único interessado: compra
    vals[b.name]=v;

function minNext(a){ return a.leader ? a.price+1 : a.start; }

  if(!willing.length) return false;
  const prob = [0.5,0.7,0.92][Math.min(a.count,2)];
  if(rnd()>prob) return false;
  const b = weighted(willing, p=>a.vals[p.name]-m+1);
  const jump = (!a.leader && rnd()<0.3) ? rint(1,4) : (rnd()<0.15 ? rint(1,2) : 0);
  a.price = Math.min(a.vals[b.name], m+jump); a.leader=b.name; a.log.push({who:b.name, price:a.price}); a.count=0;

}
function humanBid(state, a, who, amount){

  if(a.done || amount<minNext(a) || amount>maxBid(p) || !canBid(p,a.lot)) return false;

}
function closeLot(state, a){

}

// ---- lance fechado (passa o iPad) ----
function sealedResolve(state, lot, bids){
  const entries = Object.entries(bids).filter(([n,v])=>v>0);
  state.sold.push(lot.id);
  if(!entries.length) return {winner:null, price:0};
  const top = Math.max(...entries.map(e=>e[1]));
  const tied = entries.filter(e=>e[1]===top);
  const [n] = pick(tied);
  give(state.parts.find(p=>p.name===n), lot, top);
  return {winner:n, price:top, tie:tied.length>1};
}

// ---- força do time ----
const W_AT={ATA:1,MEI:0.7,LAT:0.3,VOL:0.25,ZAG:0.1}, W_MD={VOL:1,MEI:1,LAT:0.3,ATA:0.3,ZAG:0.1}, W_DF={ZAG:1,LAT:0.8,VOL:0.6,GOL:1.6};

function chemistry(team){
  if(team.hist) return {mult:1.02, grupos:[]};
  const g={}; team.players.forEach(p=>{ const k=p.sel+" "+p.copa; g[k]=(g[k]||0)+1; });
  let b=0; const grupos=[]; Object.entries(g).forEach(([k,n])=>{ if(n>1){ b+=(n-1)*0.01; grupos.push([k,n]); } });
  if(team.coach && g[team.coach.sel+" "+team.coach.copa]>=2) b+=0.01;

}
function ratings(team, style){

  const c = 1 + ((team.coach?team.coach.ov:70)-75)*0.003;
  const ch = chemistry(team).mult;
  const at = wavg(ps,W_AT,"at")*s[0]*c*ch, md = wavg(ps,W_MD,"cr")*s[1]*c*ch, df = wavg(ps,W_DF,"de")*s[2]*c*ch;

// seleção histórica: os 7 melhores do XI titular, encaixados no futebol 7
const PREF = {GOL:["GOL"], DEF:["ZAG","LAT"], VOL:["VOL","MEI","ZAG"], MEI:["MEI","VOL","ATA"], ATA:["ATA","MEI"]};

function pickSeven(xi){
  const left=xi.slice(), out=[];
  ["GOL","DEF","DEF","VOL","MEI","MEI","ATA"].forEach(slot=>{
    for(const pos of PREF[slot]){
      const c=left.filter(p=>p.pos===pos); if(!c.length) continue;
      const best=c.sort((a,b)=>SCORE[slot](b)-SCORE[slot](a))[0];
      left.splice(left.indexOf(best),1); out.push({...best, slot}); return;
    }
    const best=left.sort((a,b)=>SCORE[slot](b)-SCORE[slot](a))[0]; left.splice(left.indexOf(best),1); out.push({...best, slot});
  });

}
function histTeam(db, copa, sel){

  const coach = db.coaches.find(c=>c.copa===copa && c.sel===sel);
  const t = {name:sel+" "+copa, sel, copa, players:pickSeven(xi), coach, hist:true};
  const r = ratings({...t, style:"Equilibrado"});
  const h = [...(sel+copa)].reduce((a,ch)=>a+ch.charCodeAt(0),0);

}

// ---- partida ----
function scorer(team){ const c=team.players.filter(p=>p.pos!=="GOL"); return weighted(c, p=> Math.pow(Math.max(p.at,20)/60,4)*({ATA:3,MEI:1.6,VOL:0.6,DEF:0.5})[p.slot||cat(p.pos)]); }
function playMatch(A, B, opt={}){
  const sa = opt.styleA || A.style, sb = opt.styleB || B.style;
  const ra = ratings(A, sa), rb = ratings(B, sb);
  const k=3.0, base=1.75;
  let la = base*Math.pow((0.65*ra.at+0.35*ra.md)/(0.65*rb.df+0.35*rb.md), k);
  let lb = base*Math.pow((0.65*rb.at+0.35*rb.md)/(0.65*ra.df+0.35*ra.md), k);
  let duelo=null;
  if(BEATS[sa]===sb){ la*=1.08; lb*=0.95; duelo="A"; } else if(BEATS[sb]===sa){ lb*=1.08; la*=0.95; duelo="B"; }
  if(opt.knockout){ la*=1+0.04*Math.min(ra.craques,3); lb*=1+0.04*Math.min(rb.craques,3); }
  la*=Math.exp(gauss()*0.15); lb*=Math.exp(gauss()*0.15);
  la=Math.min(Math.max(la,0.2),6); lb=Math.min(Math.max(lb,0.2),6);
  const ev=[]; const add=(team,side,n,from,to)=>{ for(let i=0;i<n;i++) ev.push({min:rint(from,to), side, nome:scorer(team).nome}); };
  let ga=poisson(la), gb=poisson(lb); add(A,"A",ga,1,90); add(B,"B",gb,1,90);

  if(opt.knockout && ga===gb){
    et=true; const ea=poisson(la*0.33), eb=poisson(lb*0.33); add(A,"A",ea,91,120); add(B,"B",eb,91,120); ga+=ea; gb+=eb;
    if(ga===gb) pens=penalties(A,B);

function penalties(A,B){
  const shooters=t=>t.players.filter(p=>p.pos!=="GOL").sort((a,b)=>b.at-a.at);
  const gk=t=>(t.players.find(p=>p.pos==="GOL")||{de:70});
  const sA=shooters(A), sB=shooters(B); let a=0,b=0; const seq=[];
  const kick=(s,k)=> rnd() < 0.74 + (s.at-78)/250 + (s.craque?0.05:0) - (k.de-78)/250;
  for(let i=0;i<30;i++){
    const x=sA[i%sA.length], y=sB[i%sB.length];
    const gx=kick(x,gk(B)); if(gx)a++; seq.push({side:"A",gol:gx,nome:x.nome,a,b});
    if(i<5 && (a>b+(5-i) || b>a+(4-i))) break;
    const gy=kick(y,gk(A)); if(gy)b++; seq.push({side:"B",gol:gy,nome:y.nome,a,b});
    if(i<5){ if(a>b+(4-i) || b>a+(4-i)) break; }
    else if(a!==b) break;
  }
  return {a,b,seq};
}

function buildCup(customTeams, db, copas){
  const pool=[]; copas.forEach(c=>{ [...new Set(db.players.filter(p=>p.copa===c).map(p=>p.sel))].forEach(s=>pool.push(histTeam(db,c,s))); });
  const need = 32-customTeams.length;
  const champs = shuffle(pool.filter(t=>CHAMPS[t.copa]===t.sel)).slice(0, need);
  const rest = shuffle(pool.filter(t=>!champs.includes(t))).slice(0, need-champs.length);
  const teams = [...customTeams, ...champs, ...rest];
  teams.forEach((t,i)=>t.idx=i);
  const order = shuffle(teams.map(t=>t.idx));                 // ordem do sorteio
  const groups=[]; for(let g=0;g<8;g++) groups.push([]);
  order.forEach((idx,k)=>groups[k%8].push(idx));
  return {teams, groups, drawOrder:order, results:[], stage:0, ko:{}, champion:null};
}
const STAGES=["Fase de grupos, rodada 1","Fase de grupos, rodada 2","Fase de grupos, rodada 3","Oitavas de final","Quartas de final","Semifinal","Final"];
const GROUP_PAIRS=[[[0,1],[2,3]],[[0,2],[1,3]],[[0,3],[1,2]]];
function standings(cup, g){

  cup.results.filter(r=>r.stage<3 && r.g===g).forEach(r=>{
    const A=tab[r.a],B=tab[r.b]; A.j++;B.j++; A.gp+=r.ga;A.gc+=r.gb;B.gp+=r.gb;B.gc+=r.ga;
    if(r.ga>r.gb){A.v++;B.d++;A.pts+=3;} else if(r.ga<r.gb){B.v++;A.d++;B.pts+=3;} else {A.e++;B.e++;A.pts++;B.pts++;}
  });

}
function fixtures(cup){
  const s=cup.stage;
  if(s<3) return cup.groups.flatMap((grp,g)=>GROUP_PAIRS[s].map(([x,y])=>({a:grp[x],b:grp[y],g,stage:s})));
  if(s===3){
    const st=cup.groups.map((_,g)=>standings(cup,g));
    const P=[[0,1],[2,3],[4,5],[6,7],[1,0],[3,2],[5,4],[7,6]];
    return P.map(([x,y],k)=>({a:st[x][0].i,b:st[y][1].i,stage:3,slot:k}));

function playStage(cup, styleFor){

  stopTimer();
  if(allDone(G.parts)){ endAuction(); return; }
  const s=st(); let lot=null; G.fixedPrice=null;
  if(G.mode==="fixed"){
    const u=me();
    for(let i=0;i<25 && !lot;i++){ const l=drawLot(s,u.name); if(l && l.preco<=maxBid(u)) lot=l; }
    if(!lot){ lot=drawLot(s,u.name); if(lot) G.fixedPrice=Math.min(lot.preco,maxBid(u)); }
  } else lot=drawLot(s);
  if(!lot){ endAuction(); return; }
  G.lot=lot; G.lotNo++; G.result=null; G.auction=null; G.sealed=null;
  if(G.mode==="bots"){ G.auction=openLot(s,lot); runAuctionTimer(); }
  if(G.mode==="sealed"){ G.sealed={order:G.parts.map(p=>p.name), idx:0, bids:{}}; UI.sealedView="handoff"; skipSealedIneligible(); }
  go();
}
function userInvolved(){ const a=G.auction, u=me(); return a && !a.done && canBid(u,a.lot) && !a.userOut && maxBid(u)>=minNext(a) || (a && a.leader===u.name); }
function runAuctionTimer(){
  if(UI.paused || !G.auction || G.auction.done) return;
  const ms = userInvolved() ? (UI.fast?650:1150) : (UI.fast?160:420);
  every(ms, auctionTick);
}
function auctionTick(){
  const a=G.auction; if(!a||a.done){ stopTimer(); return; }
  const wasInvolved=userInvolved();
  const s=st(); const bid=botTick(s,a); if(!bid) a.count++;
  if(a.count>=3){ closeLot(s,a); G.sold=s.sold; G.result={winner:a.winner, price:a.price}; stopTimer(); save(); render(); scheduleNext(); return; }
  render();
  if(wasInvolved!==userInvolved()) runAuctionTimer();
}
function scheduleNext(){ if(NEXT) clearTimeout(NEXT); if(!UI.paused) NEXT=setTimeout(()=>{ NEXT=null; nextLot(); }, UI.fast?900:1900); }
function bidNow(v){ const a=G.auction; if(humanBid(st(),a,me().name,v)){ render(); runAuctionTimer(); } }
function leaveAuction(){ G.auction.userOut=true; render(); runAuctionTimer(); }
function togglePause(){ UI.paused=!UI.paused; if(UI.paused) stopTimer(); else if(G.result) scheduleNext(); else runAuctionTimer(); render(); }
function toggleFast(){ UI.fast=!UI.fast; if(!UI.paused){ if(G.result) scheduleNext(); else runAuctionTimer(); } render(); }

function lotCard(l){
  const tec=l.pos==="TEC", c=cat(l.pos);
  const bars = tec ? "" : (l.pos==="GOL" ? bar("Defesa",l.de) : bar("Ataque",l.at)+bar("Criação",l.cr)+bar("Defesa",l.de));
  return `<article class="card ${l.craque?"gold":""}">
    <div class="card-top"><span class="copa">${l.copa}</span><span class="sel">${esc(l.sel)}</span></div>
    <div class="card-ov">${l.ov}</div>
    <h3>${esc(l.nome)}</h3>
    <div class="card-pos">${SLOT_NAME[c]}${c==="DEF"?` <em>(${l.pos==="LAT"?"lateral":"zagueiro"})</em>`:""}${l.craque?`<span class="crq">Craque</span>`:""}</div>
    ${tec?`<p class="tecnote">Nota do técnico = força da seleção que ele comandou${CHAMPS[l.copa]===l.sel?", com bônus de campeão":""}.</p>`:`<div class="bars">${bars}</div>`}
    <div class="card-price">Preço de referência <strong>${money(G.fixedPrice||l.preco)}</strong></div>
  </article>`;
}
function bar(n,v){ return `<div class="bar"><span>${n}</span><i style="--v:${Math.max(0,Math.min(100,(v-40)/55*100))}%"></i><b>${v}</b></div>`; }
function viewAuction(){
  const controls = G.mode==="bots" ? `<div class="ctl"><button class="chipbtn" onclick="togglePause()">${UI.paused?"Continuar":"Pausar"}</button><button class="chipbtn ${UI.fast?"on":""}" onclick="toggleFast()">Rápido</button></div>` : "";
  const action = G.mode==="bots" ? auctionBots() : G.mode==="fixed" ? auctionFixed() : auctionSealed();
  const hide = G.mode==="sealed" && UI.sealedView==="handoff" && !G.result;
  const stuck = G.lotNo>=35 && G.parts.some(p=>p.human&&slotsLeft(p)>0);
  return topBar(`Jogador <strong>${G.lotNo}</strong> do leilão`)+`<section class="wrap">${controls}${hide?"":lotCard(G.lot)}${action}${rostersPanel()}${stuck?`<p class="hint">Leilão longo demais? <button class="link" onclick="fillMine()">Completar meu time com reforços baratos</button></p>`:""}</section>`;
}
function whyNot(p,l){
  if(slotsLeft(p)===0) return "Seu time está completo. Agora é torcer contra os rivais.";
  const c=cat(l.pos);
  if(!needs(p)[c]) return c==="TEC"?"Você já tem técnico.":`Você já tem ${c==="DEF"?"os 2 defensores":c==="MEI"?"os 2 meias":"seu "+SLOT_NAME[c].toLowerCase()}.`;
  if(maxBid(p)<1) return "Sem dinheiro para este lance.";
  return "";
}
const CALL=["Quem dá mais?","Dou-lhe uma…","Dou-lhe duas…"];
function auctionBots(){
  const a=G.auction, u=me(), mb=maxBid(u), m=minNext(a);
  const log=a.log.slice(-5).reverse().map((x,i)=>`<li class="${i===0?"top":""}"><span>${esc(x.who)}</span><b>${money(x.price)}</b></li>`).join("");
  if(G.result){
    const r=G.result, mine=r.winner===u.name;
    return `<div class="panel result ${mine?"win":""}"><em class="sold">Vendido!</em><strong>${r.winner?(mine?`Você levou por ${money(r.price)}`:`${esc(r.winner)} levou por ${money(r.price)}`):"Ninguém quis este jogador"}</strong>
      ${log?`<ul class="log">${log}</ul>`:""}
      <button class="btn big" onclick="nextLot()">Próximo jogador</button></div>`;
  }
  const why=whyNot(u,a.lot); const out=a.userOut||!!why;
  const lead=a.leader?(a.leader===u.name?"Seu lance está na frente":`${esc(a.leader)} está na frente`):"Ninguém deu lance ainda";
  const opts=[m, m+2, m+5];
  return `<div class="panel">
    <div class="price"><span class="call c${a.count}">${CALL[Math.min(a.count,2)]}</span><strong>${a.leader?money(a.price):money(a.start)}</strong><em>${a.leader?lead:"Lance inicial"}</em></div>
    ${log?`<ul class="log">${log}</ul>`:""}
    ${out?`<p class="watch">${why||"Você saiu da disputa. Assistindo…"}</p>`:`
      <div class="bids">${opts.map(v=>`<button class="btn" ${v>mb||a.leader===u.name?"disabled":""} onclick="bidNow(${v})">${money(v)}</button>`).join("")}</div>
      <button class="btn ghost big" onclick="leaveAuction()">Sair da disputa</button>
      <p class="hint">Você pode dar até ${money(mb)} e ainda completar o time com R$ 1 por vaga.</p>`}
  </div>`;
}
function auctionFixed(){
  const u=me(), l=G.lot, price=G.fixedPrice||l.preco;
  if(G.result) return `<div class="panel result ${G.result.bought?"win":""}"><strong>${G.result.bought?`Comprado por ${money(price)}`:"Você passou. Ele não volta mais."}</strong><button class="btn big" onclick="nextLot()">Próximo jogador</button></div>`;
  const ok=canBid(u,l)&&price<=maxBid(u);
  return `<div class="panel"><div class="price"><span>Preço</span><strong>${money(price)}</strong><em>${ok?"Compre agora ou perca para sempre":whyNot(u,l)}</em></div>
    <div class="bids two"><button class="btn" ${ok?"":"disabled"} onclick="buyFixed()">Comprar</button><button class="btn ghost" onclick="passFixed()">Passar</button></div>
    <p class="hint">Vagas abertas: ${slotsLeft(u)}. Caixa: ${money(u.budget)}.</p></div>`;
}
function buyFixed(){ const u=me(); const price=G.fixedPrice||G.lot.preco; G.sold.push(G.lot.id); give(u,G.lot,price); G.result={bought:true}; go(); }
function passFixed(){ G.sold.push(G.lot.id); G.result={bought:false}; go(); }
function skipSealedIneligible(){
  const sd=G.sealed;
  while(sd.idx<sd.order.length){ const p=G.parts.find(x=>x.name===sd.order[sd.idx]); if(canBid(p,G.lot)) break; sd.bids[p.name]=0; sd.idx++; }
  if(sd.idx>=sd.order.length){ const s=st(); G.result=sealedResolve(s,G.lot,sd.bids); G.sold=s.sold; }
}
function auctionSealed(){
  const sd=G.sealed;
  if(G.result){ const r=G.result;
    return `<div class="panel result"><strong>${r.winner?`${esc(r.winner)} levou por ${money(r.price)}${r.tie?" (empate no sorteio)":""}`:"Ninguém deu lance"}</strong>
      <ul class="log">${G.parts.map(p=>`<li><span>${esc(p.name)}</span><b>${sd.bids[p.name]?money(sd.bids[p.name]):"passou"}</b></li>`).join("")}</ul><button class="btn big" onclick="nextLot()">Próximo jogador</button></div>`; }
  const p=G.parts.find(x=>x.name===sd.order[sd.idx]);
  if(UI.sealedView==="handoff") return `<div class="panel handoff"><span>Passe o iPad para</span><strong>${esc(p.name)}</strong><button class="btn big" onclick="UI.sealedView='bid';render()">Sou ${esc(p.name)}, mostrar jogador</button></div>`;
  const mb=maxBid(p), v0=Math.min(G.lot.preco,mb);
  return `<div class="panel"><div class="price"><span>Seu lance escondido, ${esc(p.name)}</span><strong id="sb">${money(v0)}</strong><em>Até ${money(mb)}. Zero é passar.</em></div>
    <input type="range" min="0" max="${mb}" value="${v0}" id="sbr" oninput="$('sb').textContent='R$ '+this.value" aria-label="Valor do lance">
    <div class="bids two"><button class="btn" onclick="sealedBid(+$('sbr').value)">Confirmar lance</button><button class="btn ghost" onclick="sealedBid(0)">Passar</button></div></div>`;
}
function sealedBid(v){ const sd=G.sealed; sd.bids[sd.order[sd.idx]]=v; sd.idx++; UI.sealedView="handoff"; skipSealedIneligible(); go(); }
function chips(p){ const n=needs(p); return CAT_ORDER.filter(k=>n[k]).map(k=>`<span class="chip">${k} ${n[k]}</span>`).join("") || `<span class="chip ok">Completo</span>`; }
function rosterList(p){ return [...p.roster].sort((a,b)=>CAT_ORDER.indexOf(cat(a.pos))-CAT_ORDER.indexOf(cat(b.pos))).concat(p.coach?[p.coach]:[]).map(x=>`<li><span>${cat(x.pos)}</span>${esc(x.nome)} <em>${x.copa}</em><b>${x.ov}</b><i>${money(x.pago)}</i></li>`).join("")||"<li>Nenhum jogador ainda</li>"; }
function rostersPanel(){
  return `<div class="rosters"><div class="rp-top"><h2>Times</h2><button class="link" onclick="UI.showRosters=!UI.showRosters;render()">${UI.showRosters?"Esconder jogadores":"Ver jogadores"}</button></div>
  ${G.parts.map(p=>`<div class="rp ${p.human?"human":""}"><div class="rp-h"><strong>${esc(p.name)}</strong><span>${money(p.budget)}</span></div><div class="chips">${chips(p)}</div>${UI.showRosters?`<ul class="mini">${rosterList(p)}</ul>`:""}</div>`).join("")}</div>`;
}
function fillMine(){
  stopTimer(); const sold=new Set(G.sold);
  G.parts.filter(p=>p.human).forEach(p=>Object.entries(needs(p)).forEach(([c,k])=>{ for(let i=0;i<k;i++){
    const pool=(c==="TEC"?DB.coaches:DB.players.filter(x=>cat(x.pos)===c)).filter(x=>!sold.has(x.id)).sort((a,b)=>a.ov-b.ov);
    const x=pick(pool.slice(Math.floor(pool.length*0.1), Math.max(Math.floor(pool.length*0.25),Math.floor(pool.length*0.1)+3))); if(!x) continue;
    sold.add(x.id); G.sold.push(x.id); give(p,x,Math.min(1,maxBid(p))); } }));
  G.result=null; nextLot();
}
function endAuction(){ stopTimer(); G.parts.forEach(p=>G.styles[p.name]=p.style); G.screen="squad"; UI.odds=null; go(); }

// ---------- TIMES ----------
function teamOfPart(p){ return customTeam(p, G.styles[p.name]); }
function meter(n,v,main){ return `<div class="meter ${main?"main":""}"><span>${n}</span><strong>${Math.round(v)}</strong><i style="--v:${Math.max(0,Math.min(100,(v-55)/40*100))}%"></i></div>`; }
function squadBlock(p, open){
  const t=teamOfPart(p), r=ratings(t), ch=chemistry(t);
  const rows=[...p.roster].sort((a,b)=>CAT_ORDER.indexOf(cat(a.pos))-CAT_ORDER.indexOf(cat(b.pos))).concat([p.coach]).map(x=>`
    <li class="${x.craque?"crqrow":""}"><span class="pos">${cat(x.pos)}</span><span class="nm">${esc(x.nome)}<em>${esc(x.sel)} ${x.copa}, pago ${money(x.pago)}</em></span><b>${x.ov}</b></li>`).join("");
  const body=`<div class="meters">${meter("Ataque",r.at)}${meter("Meio",r.md)}${meter("Defesa",r.df)}${meter("Geral",r.geral,true)}</div>
    <p class="hint">${ch.grupos.length?`Entrosamento: ${ch.grupos.map(([k,n])=>`${n} de ${esc(k)}`).join(", ")} (+${Math.round((ch.mult-1)*100)}%).`:"Sem entrosamento: nenhum par da mesma seleção."} Sobrou ${money(p.budget)}.</p>
    <ul class="lineup">${rows}</ul>
    ${p.human?`<label class="stylepick">Estilo de jogo<select data-n="${esc(p.name)}" onchange="setStyle(this.dataset.n,this.value)">${STYLES.map(s=>`<option ${G.styles[p.name]===s?"selected":""}>${s}</option>`).join("")}</select></label>`:`<p class="hint">Estilo: ${G.styles[p.name]}.</p>`}`;
  return p.human ? `<div class="squad"><div class="sq-h"><h2>${esc(p.name)}</h2><span>${Math.round(r.geral)}</span></div>${body}</div>`
    : `<details class="squad rival" ${open?"open":""}><summary><strong>${esc(p.name)}</strong><span>${Math.round(r.geral)}</span></summary>${body}</details>`;
}
function setStyle(n,v){ G.styles[n]=v; UI.odds=null; go(); }
function viewSquad(){
  const humans=G.parts.filter(p=>p.human), rivals=G.parts.filter(p=>!p.human);
  return topBar("Times fechados")+`<section class="wrap">
    ${humans.map(p=>squadBlock(p)).join("")}
    ${rivals.length?`<h2>Rivais do leilão</h2><p class="hint">Eles também jogam a Copa.</p>${rivals.map(p=>squadBlock(p)).join("")}`:""}
    <div class="panel"><h2>Chance de título</h2>${UI.odds?oddsView():`<p class="hint">Simula 100 Copas para ver as chances antes da real.</p><button class="btn ghost" onclick="runOdds()">Simular 100 Copas</button>`}</div>
    <div class="legend"><strong>Duelo de estilos</strong> Pressão alta vence Posse de bola, Posse de bola vence Contra-ataque, Contra-ataque vence Pressão alta. Quem acerta ganha cerca de 8% a mais de chance de gol.</div>
    <button class="btn big" onclick="startCup()">Sorteio dos grupos</button>
  </section>`;
}
function runOdds(){
  const teams=G.parts.map(teamOfPart); const N=100; const T={}; teams.forEach(t=>T[t.name]={t:0,f:0,s:0,q:0});
  for(let i=0;i<N;i++){ const cup=buildCup(teams.map(t=>JSON.parse(JSON.stringify(t))),DB,G.copas); while(cup.stage<7) playStage(cup);
    teams.forEach((t,j)=>{ const x=T[t.name]; if(cup.ko[3].includes(j))x.q++; if(cup.ko[4].includes(j))x.s++; if(cup.ko[5].includes(j))x.f++; if(cup.champion===j)x.t++; }); }
  UI.odds=T; render();
}
function oddsView(){ return Object.entries(UI.odds).map(([n,x])=>`<div class="odds"><strong>${esc(n)}</strong><div><span>Título</span><b>${x.t}%</b></div><div><span>Final</span><b>${x.f}%</b></div><div><span>Semi</span><b>${x.s}%</b></div><div><span>Quartas</span><b>${x.q}%</b></div></div>`).join("")+`<button class="link" onclick="runOdds()">Simular de novo</button>`; }

// ---------- COPA ----------
function startCup(){ G.cup=buildCup(G.parts.map(teamOfPart),DB,G.copas); G.screen="cup"; G.view="draw"; UI.drawn=0; go(); runDraw(); }
function runDraw(){ every(UI.fast?90:330, ()=>{ UI.drawn++; if(UI.drawn>=32){ stopTimer(); } render(); }); }
const isHuman = t => !!t.human;
const isCustom = t => !t.hist;
function styleFor(A){ return isCustom(A) ? (G.styles[A.name]||A.style) : A.style; }
function tl(t){ return t.hist ? `${esc(t.sel)} <em>${t.copa}</em>` : `<b class="${t.human?"hum":"riv"}">${esc(t.name)}</b>`; }
function humanIdxs(){ return G.cup.teams.filter(isHuman).map(t=>t.idx); }
function alive(idx){ const c=G.cup; if(c.stage<3) return true; if(c.stage===3) return fixtures(c).some(f=>f.a===idx||f.b===idx); const w=c.ko[c.stage-1]; return !!w && w.includes(idx); }
function viewCup(){
  const c=G.cup;
  if(G.view==="draw") return topBar("Sorteio dos grupos")+viewDraw();
  if(G.view==="live") return topBar(STAGES[G.live.stage])+viewLive();
  if(c.champion!=null) return topBar("Copa encerrada")+viewChampion();
  return topBar(STAGES[c.stage])+viewTable();
}
function viewDraw(){
  const c=G.cup, L="ABCDEFGH", shown=new Set(c.drawOrder.slice(0,UI.drawn));
  const cur=UI.drawn>0&&UI.drawn<=32 ? c.teams[c.drawOrder[UI.drawn-1]] : null;
  return `<section class="wrap">
    <div class="drawball">${cur?`<span>Grupo ${L[(UI.drawn-1)%8]}</span><strong>${tl(cur)}</strong>`:`<span>Misturando as bolinhas…</span>`}</div>
    <div class="dgrid">${c.groups.map((g,gi)=>`<div class="dg"><h3>Grupo ${L[gi]}</h3>${g.map(i=>`<div class="dslot ${shown.has(i)?"in":""} ${i===c.drawOrder[UI.drawn-1]?"new":""}">${shown.has(i)?tl(c.teams[i]):"&nbsp;"}</div>`).join("")}</div>`).join("")}</div>
    ${UI.drawn<32?`<button class="btn ghost big" onclick="UI.drawn=32;stopTimer();render()">Pular sorteio</button>`:`<button class="btn big" onclick="G.view='table';go()">Ver os jogos da rodada 1</button>`}
  </section>`;
}
function duelHint(a,b){ if(BEATS[a]===b) return "Boa: seu estilo leva vantagem nesse duelo."; if(BEATS[b]===a) return "Cuidado: o estilo deles leva vantagem sobre o seu."; return "Duelo de estilos neutro."; }
function viewTable(){
  const c=G.cup, hs=humanIdxs(), living=hs.filter(alive), fx=fixtures(c);
  const mine=fx.filter(f=>hs.includes(f.a)||hs.includes(f.b));
  const pre=mine.map(f=>{ const h=hs.includes(f.a)?f.a:f.b, o=h===f.a?f.b:f.a, H=c.teams[h], O=c.teams[o];
    return `<div class="panel match-pre"><div class="vs"><div><strong>${tl(H)}</strong><span>${Math.round(ratings(H,styleFor(H)).geral)}</span></div><i>x</i><div><strong>${tl(O)}</strong><span>${Math.round(ratings(O).geral)}</span></div></div>
      <p class="hint">${O.hist?`${esc(O.sel)} ${O.copa}`:esc(O.name)} costuma jogar no estilo <strong>${styleFor(O)}</strong>${O.coach?`, com ${esc(O.coach.nome)} no banco`:""}.</p>
      <label class="stylepick">Seu estilo para este jogo<select data-n="${esc(H.name)}" onchange="setStyle(this.dataset.n,this.value)">${STYLES.map(s=>`<option ${styleFor(H)===s?"selected":""}>${s}</option>`).join("")}</select></label>
      <p class="hint">${duelHint(styleFor(H),styleFor(O))}</p></div>`; }).join("");
  const label = c.stage<3 ? `Jogar rodada ${c.stage+1}` : `Jogar ${STAGES[c.stage].toLowerCase()}`;
  return `<section class="wrap">
    ${!living.length?`<div class="panel result"><strong>${hs.length>1?"Todos os times humanos caíram":"Seu time foi eliminado"}</strong><span>A Copa continua. Assista até o campeão.</span></div>`:""}
    ${pre}
    <button class="btn big" onclick="playLive()">${living.length?label:"Assistir "+(c.stage<3?`rodada ${c.stage+1}`:STAGES[c.stage].toLowerCase())}</button>
    ${c.stage<=3?groupsView(hs):bracketView()}
  </section>`;
}
function groupsView(hs){
  const c=G.cup, L="ABCDEFGH";
  const order=[...c.groups.keys()].sort((a,b)=>(c.groups[b].some(i=>hs.includes(i))?1:0)-(c.groups[a].some(i=>hs.includes(i))?1:0));
  return `<h2>Grupos</h2>`+order.map(g=>`<div class="group"><h3>Grupo ${L[g]}</h3><table><thead><tr><th scope="col">Time</th><th>P</th><th>J</th><th>V</th><th>SG</th></tr></thead><tbody>${standings(c,g).map((r,k)=>`<tr class="${hs.includes(r.i)?"me":""} ${k<2&&c.stage===3?"q":""}"><td>${tl(c.teams[r.i])}</td><td>${r.pts}</td><td>${r.j}</td><td>${r.v}</td><td>${r.gp-r.gc}</td></tr>`).join("")}</tbody></table></div>`).join("");
}
function scoreLine(r){ return `${r.ga} x ${r.gb}${r.pens?` <small>(${r.pens.a}-${r.pens.b} pên.)</small>`:""}`; }
function bracketView(){
  const c=G.cup, hs=humanIdxs(); let h="<h2>Mata-mata</h2>";
  for(let s=3;s<c.stage;s++) h+=`<h3 class="stage">${STAGES[s]}</h3>`+c.results.filter(r=>r.stage===s).map(r=>`<div class="orow ${hs.includes(r.a)||hs.includes(r.b)?"me":""}"><span>${tl(c.teams[r.a])}</span><b>${scoreLine(r)}</b><span>${tl(c.teams[r.b])}</span></div>`).join("");
  return h;
}

// ---- jogo ao vivo ----
function playLive(){
  const c=G.cup; const stage=c.stage;
  const res=playStage(c, styleFor); save();
  const hs=humanIdxs();
  let feat=res.filter(r=>hs.includes(r.a)||hs.includes(r.b));
  if(!feat.length) feat=[res[0]];
  G.live={stage, res, feat:feat.map(r=>res.indexOf(r)), min:0, phase:"1T", pause:0, pen:0, ko:stage>=3};
  G.view="live"; render(); runLive();
}
function runLive(){ every(UI.fast?45:150, liveTick); }
function liveTick(){
  const L=G.live;
  if(L.phase==="1T"||L.phase==="2T"||L.phase==="PR"){
    L.min++;
    if(L.phase==="1T" && L.min>=45){ L.phase="INT"; L.pause=10; }
    else if(L.phase==="2T" && L.min>=90){ if(L.ko && L.res.some(r=>r.et)){ L.phase="FIM90"; L.pause=12; } else L.phase="FIM"; }
    else if(L.phase==="PR" && L.min>=120){ if(L.res.some(r=>r.pens)){ L.phase="PEN"; L.pause=8; } else L.phase="FIM"; }
  } else if(L.phase==="INT"){ if(--L.pause<=0) L.phase="2T"; }
  else if(L.phase==="FIM90"){ if(--L.pause<=0) L.phase="PR"; }
  else if(L.phase==="PEN"){
    if(--L.pause<=0){ const fp=featPens(); if(fp && L.pen<fp.seq.length){ L.pen++; L.pause=6; } else L.phase="FIM"; }
  }
  if(L.phase==="FIM"){ stopTimer(); }
  render();
}
function feedHtml(r,evs,A,B,lim){
  if(!evs.length) return `<li class="none">${lim>=45?"Nenhum gol até agora":"Bola rolando, ainda sem gols"}</li>`;
  const out=[]; let sepPR=false, sepHT=false;
  evs.forEach(e=>{
    if(!sepPR && lim>90 && e.min<=90 && r.et){ out.push(`<li class="sep">Prorrogação acima</li>`); sepPR=true; }
    if(!sepHT && lim>45 && e.min<=45){ const h=r.ev.filter(x=>x.min<=45); out.push(`<li class="sep">Intervalo: ${h.filter(x=>x.side==="A").length} x ${h.filter(x=>x.side==="B").length}</li>`); sepHT=true; }
    out.push(`<li><b>${e.min}'</b>${esc(e.nome)} <em>${e.side==="A"?tl(A):tl(B)}</em></li>`);
  });
  return out.join("");
}
function featPens(){ const L=G.live; const r=L.feat.map(i=>L.res[i]).find(r=>r.pens); return r?r.pens:null; }
function skipLive(){ const L=G.live; L.min=L.ko&&L.res.some(r=>r.et)?120:90; const fp=featPens(); L.pen=fp?fp.seq.length:0; L.phase="FIM"; stopTimer(); render(); }
function liveScore(r){ const L=G.live; const lim=(r.et||L.min<=90)?L.min:90; const g=r.ev.filter(e=>e.min<=lim); return [g.filter(e=>e.side==="A").length, g.filter(e=>e.side==="B").length]; }
function phaseLabel(L){ return ({"1T":"1º tempo","INT":"Intervalo","2T":"2º tempo","FIM90":"Fim do tempo normal","PR":"Prorrogação","PEN":"Pênaltis","FIM":"Fim de jogo"})[L.phase]; }
function viewLive(){
  const L=G.live, c=G.cup, done=L.phase==="FIM";
  const feat=L.feat.map(i=>L.res[i]);
  const cards=feat.map(r=>{
    const [a,b]=liveScore(r), A=c.teams[r.a], B=c.teams[r.b];
    const lim=(r.et||L.min<=90)?L.min:90;
    const evs=r.ev.filter(e=>e.min<=lim).slice().reverse();
    const fresh=evs.length && evs[0].min>=L.min-2 && !done;
    let pens="";
    if(r.pens && (L.phase==="PEN"||done)){ const show=done?r.pens.seq:r.pens.seq.slice(0,L.pen); const last=show[show.length-1];
      pens=`<div class="pens-live"><strong>Pênaltis ${last?last.a:0} x ${last?last.b:0}</strong><ol>${show.map(k=>`<li class="${k.gol?"g":"m"}"><span>${k.side==="A"?tl(A):tl(B)}</span>${esc(k.nome)} ${k.gol?"marcou":"perdeu"}</li>`).join("")}</ol></div>`; }
    return `<div class="panel live ${fresh?"goal":""}">
      <div class="score"><div>${tl(A)}</div><strong>${a} x ${b}</strong><div>${tl(B)}</div></div>
      ${fresh?`<p class="gooal">Gol de ${esc(evs[0].nome)}!</p>`:""}
      <ul class="feed">${feedHtml(r,evs,A,B,lim)}</ul>
      ${pens}
      ${done&&r.duelo?`<p class="hint">${r.duelo==="A"?tl(A):tl(B)} venceu o duelo de estilos (${r.duelo==="A"?r.sa:r.sb}).</p>`:""}
    </div>`;
  }).join("");
  const others=L.res.filter((r,i)=>!L.feat.includes(i)).map(r=>{ const [a,b]=liveScore(r); const lim=(r.et||L.min<=90)?L.min:90; const fresh=r.ev.some(e=>e.min<=lim&&e.min>=L.min-2)&&!done;
    return `<div class="orow ${fresh?"flash":""}"><span>${tl(c.teams[r.a])}</span><b>${a} x ${b}${(done||L.phase==="PEN")&&r.pens?` <small>(${r.pens.a}-${r.pens.b})</small>`:""}</b><span>${tl(c.teams[r.b])}</span></div>`; }).join("");
  return `<section class="wrap">
    <div class="clock"><strong>${Math.min(L.min, L.ko&&L.res.some(r=>r.et)?120:90)}'</strong><span>${phaseLabel(L)}</span>
      ${done?"":`<div class="ctl"><button class="chipbtn ${UI.fast?"on":""}" onclick="UI.fast=!UI.fast;runLive();render()">Rápido</button><button class="chipbtn" onclick="skipLive()">Pular</button></div>`}</div>
    ${cards}
    ${others?`<h2>Outros jogos</h2><div class="panel list">${others}</div>`:""}
    ${done?`<button class="btn big" onclick="G.view='table';go()">${G.cup.champion!=null?"Ver o campeão":G.cup.stage<=3?"Ver classificação":"Ver chaveamento"}</button>`:""}
  </section>`;
}
function viewChampion(){
  const c=G.cup, T=c.teams[c.champion], won=isHuman(T), fin=c.results.find(r=>r.stage===6);
  return `<section class="wrap"><div class="trophy ${won?"won":""}"><span>Campeão</span><h2>${T.hist?`${esc(T.sel)} ${T.copa}`:esc(T.name)}</h2><p>${won?"Seu leilão virou taça.":T.rival?"Um rival do leilão levou a taça.":"Não foi dessa vez."}</p></div>
    ${fin?`<div class="panel"><div class="score"><div>${tl(c.teams[fin.a])}</div><strong>${scoreLine(fin)}</strong><div>${tl(c.teams[fin.b])}</div></div></div>`:""}
    ${bracketView()}<button class="btn big" onclick="newGame()">Jogar de novo</button></section>`;
}
function newGame(){ stopTimer(); clearSaved(); G=null; UI={showRosters:false, odds:null, sealedView:"handoff", paused:false, fast:false, quitAsk:false, drawn:0, scrollKey:""}; render(); }
if(typeof document!=="undefined" && document.getElementById("app")) render();

</script>
